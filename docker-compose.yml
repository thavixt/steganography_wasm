services:
  postgres:
    env_file: .env
    image: postgres:17
    container_name: wasm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:${POSTGRES_POST}"
    volumes:
      - ./database/migrate:/docker-entrypoint-initdb.d
      - ./database/postgres/data:/var/lib/postgresql/data
      - ./database/postgres/backups:/backups

  adminer:
    env_file: .env
    image: adminer
    container_name: wasm-adminer
    ports:
      - "8080:${ADMINER_PORT}"
    depends_on:
      - postgres
